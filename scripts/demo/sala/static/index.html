    <title>Sala de control · Riesgo de inundación urbana</title>
    <script>
      // Dark by default (the room is projected); ?tema=claro|oscuro or the saved toggle override it.
      (function () {
        var t = "dark";
        try {
          t = localStorage.getItem("sala-tema") || t;
        } catch (e) {}
        var q = new URLSearchParams(location.search).get("tema");
        if (q === "claro") t = "light";
        if (q === "oscuro") t = "dark";
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f7f7f8");
      })();
    </script>
